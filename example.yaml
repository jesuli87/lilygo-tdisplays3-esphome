esphome:
  name: tdisplays3
  friendly_name: T-Display S3

external_components:
  - source: github://jesuli87/lilygo-tdisplays3-esphome@main
    components: [tdisplays3]

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
  flash_size: 16MB
  sdkconfig_options:
    CONFIG_SPIRAM_MODE_OCT: "y"
    CONFIG_SPIRAM_SPEED_80M: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "T-Display Fallback"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
    name: "Button 1"
  - platform: gpio
    pin:
      number: GPIO14
      inverted: true
    name: "Button 2"

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_pwm
    frequency: 2000

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Backlight"
    restore_mode: RESTORE_DEFAULT_ON

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 30

display:
  - platform: tdisplays3
    id: disp
    update_interval: 5s
    rotation: 270
    lambda: |-
      it.fill(Color(0, 0, 0));
      it.printf(160, 70, id(roboto), Color(255, 255, 255), TextAlign::CENTER, "Hello!");
